        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              
                  new TomSelect("#select-node",{
                      create: false,
                      sortField: {

                      }

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"borderWidth": 3, "color": {"background": "#ff2a2a", "border": "#ffffff"}, "font": {"color": "white"}, "id": "\uc18c\ube44\uc790", "label": "\uc18c\ube44\uc790", "shape": "dot", "size": 45, "title": "\ud610\uc758\uc790 (\ub9c8\uc57d \uc758\uc2ec)"}, {"borderWidth": 3, "color": {"background": "#ff2a2a", "border": "#ffffff"}, "font": {"color": "white"}, "id": "\ud310\ub9e4\uc790", "label": "\ud310\ub9e4\uc790", "shape": "dot", "size": 45, "title": "\ud610\uc758\uc790 (\ub9c8\uc57d \uc758\uc2ec)"}, {"borderWidth": 1, "color": {"background": "#2a75ff", "border": "#88bbff"}, "font": {"color": "white"}, "id": "\uc778\ubb3c 1", "label": "\uc778\ubb3c 1", "shape": "dot", "size": 15, "title": "\uc77c\ubc18 \uc0ac\uc6a9\uc790"}, {"borderWidth": 1, "color": {"background": "#2a75ff", "border": "#88bbff"}, "font": {"color": "white"}, "id": "\uc778\ubb3c 2", "label": "\uc778\ubb3c 2", "shape": "dot", "size": 15, "title": "\uc77c\ubc18 \uc0ac\uc6a9\uc790"}]);
                  edges = new vis.DataSet([{"color": "#ff4d4d", "from": "\uc18c\ube44\uc790", "smooth": {"type": "curvedCW"}, "to": "\ud310\ub9e4\uc790", "value": 6}, {"color": "rgba(150, 150, 150, 0.4)", "from": "\uc778\ubb3c 1", "smooth": {"type": "continuous"}, "to": "\ud310\ub9e4\uc790", "value": 1}, {"color": "rgba(150, 150, 150, 0.4)", "from": "\uc778\ubb3c 1", "smooth": {"type": "continuous"}, "to": "\uc18c\ube44\uc790", "value": 1}, {"color": "rgba(150, 150, 150, 0.4)", "from": "\uc778\ubb3c 2", "smooth": {"type": "continuous"}, "to": "\ud310\ub9e4\uc790", "value": 1}, {"color": "rgba(150, 150, 150, 0.4)", "from": "\uc778\ubb3c 2", "smooth": {"type": "continuous"}, "to": "\uc18c\ube44\uc790", "value": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"forceAtlas2Based": {"gravitationalConstant": -80, "centralGravity": 0.015, "springLength": 120, "springConstant": 0.04}, "minVelocity": 0.75, "solver": "forceAtlas2Based", "stabilization": {"enabled": true, "iterations": 1000, "updateInterval": 100}}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  
                    network.on("selectNode", neighbourhoodHighlight);
                  

                  


                  

                  return network;

              }
              drawGraph();
